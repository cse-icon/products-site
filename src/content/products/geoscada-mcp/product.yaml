# MCP for Geo SCADA
#
# Copy is written from cse-icon/GeoSCADA-MCP. It runs locally on the user's
# machine over stdio, one server entry per Geo SCADA system.
# See docs/authoring-content.md.

name: MCP for Geo SCADA
order: 30
shortDescription: >-
  Troubleshoot Schneider Electric Geo SCADA (fka. ClearSCADA) by asking your AI assistant. A read-only
  Model Context Protocol server that answers "why is this point stale?" from
  the live system, with the evidence behind the answer.

tagline: Ask Geo SCADA (fka. ClearSCADA) why — and get one answer from the live system
subtitle: >-
  CSE ICON's MCP for Geo SCADA is a Model Context Protocol (MCP) server that
  connects Claude, Cursor, and any other MCP client to Schneider Electric Geo
  SCADA. Ask why a point has
  been stale since 3am and get one answer assembled from configuration,
  history, alarms, comms, and the audit trail, instead of pivoting between
  ViewX, the alarm list, the config audit, and the historic viewer.

cta:
  heading: Ready to spend less time chasing stale points?
  body: Tell us about your Geo SCADA system, and we'll set you up with a pilot.
  contactEmail: sales@cse-icon.com

seo:
  title: MCP for Geo SCADA — AI troubleshooting from CSE ICON
  description: >-
    A read-only Model Context Protocol server from CSE ICON for Schneider
    Electric Geo SCADA. Ask an AI assistant why a point is stale, why an alarm didn't fire,
    or whether comms are to blame, and get an answer from the live system.

