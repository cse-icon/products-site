shortDescription: >-
  Troubleshoot AVEVA Geo SCADA Expert by asking your AI assistant. A read-only
  Model Context Protocol server that answers "why is this point stale?" from
  the live system, with the evidence behind the answer.

tagline: Ask Geo SCADA why — and get one answer from the live system
subtitle: >-
  CSE ICON Geo SCADA MCP connects Claude, Cursor, and any other Model Context
  Protocol client to AVEVA Geo SCADA Expert (ClearSCADA). Ask why a point has
