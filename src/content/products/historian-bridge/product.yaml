# Historian Bridge
#
# Copy is written from cse-icon/CSE-Historian-Bridge. Today it reads Canary
# Historian and publishes to Azure Blob Storage; Snowflake is the proven
# consumer, not the only one. See docs/authoring-content.md.

name: Historian Bridge
order: 40
shortDescription: >-
  Continuously publish Canary Historian data — readings, aggregates, tag
  metadata, and events — as Parquet files and Apache Iceberg tables in your own
  Azure storage. Proven with Snowflake, open to any tool that reads those
  formats.

tagline: Your historian data in your data platform — complete, current, and in open formats
subtitle: >-
  CSE Historian Bridge reads Canary Historian on a schedule and publishes
  readings or aggregates, tag properties, and events to Azure Blob Storage as
  Apache Parquet files registered as Apache Iceberg tables. It feeds Snowflake
  in production today, and because nothing in the output is Snowflake-specific,
  the same files can feed any lakehouse, BI, or data-science tool that reads
  Parquet or Iceberg.

cta:
  heading: Ready to put your historian data to work?
  body: Tell us what you want to do with your historian data, and we'll scope a pilot with you.
  contactEmail: sales@cse-icon.com

seo:
  title: Historian Bridge — Canary data in Snowflake and your data lake
  description: >-
    CSE Historian Bridge continuously publishes Canary Historian readings,
    aggregates, tag metadata, and events as Parquet files and Apache Iceberg
    tables in Azure Blob Storage, ready for Snowflake and any tool that reads
    open formats.

