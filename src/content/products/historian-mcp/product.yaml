# MCP for Historians
#
# One server per historian. variants/ holds what is specific to Canary or to
# AVEVA PI; sections/ holds only what is true of both. Copy is written from
# cse-icon/CSE-Historian-MCP. See docs/authoring-content.md.

name: MCP for Historians
order: 20
shortDescription: >-
  Let AI assistants query your Canary Historian or AVEVA PI System in plain
  English. A read-only Model Context Protocol server, with analytics that
  return answers instead of raw data.

tagline: Give your AI assistant a safe, read-only window into your historian
subtitle: >-
  CSE ICON's MCP for Historians is a Model Context Protocol (MCP) server that
  connects Claude, ChatGPT, Cursor, and any other MCP client to Canary
  Historian or AVEVA™ PI System — with tag discovery,
  history, events, and server-side analytics that return computed answers
  rather than thousands of raw points.

cta:
  heading: Ready to put AI to work on your process data?
  body: >-
    Tell us whether you run Canary Historian, AVEVA PI System, or both, and
    we'll set you up with a pilot. Don't see the historian you use listed?
    Contact us and let's discuss developing an MCP server that meets your needs.
  contactEmail: sales@cse-icon.com

variantsHeading: Supported historians
variantsDescription: >-
  Each server connects to one historian. Running both? Install one for each, and
  your assistant can use them side by side.

seo:
  title: MCP for Historians — AI access to Canary and AVEVA PI System
  description: >-
    CSE ICON's MCP for Historians is a read-only Model Context Protocol server for Canary
    Historian and AVEVA PI System. Let AI assistants query process data in plain
    English, with analytics that return answers instead of raw points.

