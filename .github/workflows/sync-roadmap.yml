name: Sync Roadmap

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

# main only takes changes through a PR with passing CI, so the sync opens one
# instead of pushing. The App token does all the writing: unlike GITHUB_TOKEN,
# its PR triggers ci.yml and its merge triggers deploy-site.yml.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Org-level Projects read-only, plus Contents and Pull requests write on
      # this repo for the sync PR. One token covers every product's board, so
      # adding a product needs no change here — see src/content/products/*/product.yaml.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: cse-icon
          repositories: products-site

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Which boards to read comes from each product.yaml, not from CI variables.
      # The script validates each roadmap before writing it and skips any that
      # fail, so this step can fail while other products still synced.
      - name: Fetch roadmaps from GitHub Projects
        id: fetch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/sync-roadmap.mjs

      # The steps below run even when one board failed, so the products that
      # synced are still published. The job itself still ends red.
      - name: Test synced data
        id: test
        if: ${{ !cancelled() }}
        run: npm test

      # Only from main: the PR merges itself, so a run dispatched from a feature
      # branch would otherwise carry that branch's commits into main.
      # The bot branch is rebuilt from main on every run, so an open sync PR
      # always shows the latest board instead of piling up.
      - name: Open sync PR if changed
        if: ${{ !cancelled() && steps.test.outcome == 'success' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: bot/roadmap-sync
        run: |
          git add src/data/roadmap
          if git diff --staged --quiet; then
            echo "No roadmap changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync roadmap data"
          gh auth setup-git
          git push --force origin "HEAD:refs/heads/$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore: sync roadmap data" \
              --body "Synced from GitHub Projects by [Sync Roadmap]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Merges itself once CI passes."
          fi
          gh pr merge "$BRANCH" --auto --squash
